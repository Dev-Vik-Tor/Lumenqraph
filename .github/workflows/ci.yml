name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run security checks weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumenqraph
          POSTGRES_PASSWORD: lumenqraph
          POSTGRES_DB: lumenqraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumenqraph"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://lumenqraph:lumenqraph@localhost:5432/lumenqraph
      # Read by the #[ignore]-marked tests to reach the service container; they
      # are run explicitly in the `--ignored` step below.
      TEST_DATABASE_URL: postgres://lumenqraph:lumenqraph@localhost:5432/lumenqraph
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The tests above skip anything marked #[ignore], which is every test that
      # needs a real database — retention pruning, contract-spec versioning, and
      # webhook enqueue all live there. Run them explicitly against the service
      # container above.
      #
      # --test-threads=1 is required, not a preference: each test resets the
      # schema (DROP SCHEMA public CASCADE) to isolate itself, so running two at
      # once drops the tables out from under the other.
      - name: Test (Postgres-backed)
        run: |
          cargo test -p lumenqraph-indexer  -- --ignored --test-threads=1
          cargo test -p lumenqraph-webhooks -- --ignored --test-threads=1
          cargo test -p lumenqraph-api      -- --ignored --test-threads=1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Collect coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov --no-report -p lumenqraph-indexer  -- --ignored --test-threads=1
          cargo llvm-cov --no-report -p lumenqraph-webhooks -- --ignored --test-threads=1
          cargo llvm-cov --no-report -p lumenqraph-api      -- --ignored --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Build (release)
        run: cargo build --workspace --release

  sdk-test:
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: sdk/typescript
      - name: Run tests
        run: npm test
        working-directory: sdk/typescript

  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  supply-chain-security:
    name: Supply Chain Security (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check supply chain
        run: cargo deny check
        continue-on-error: true
