version: 2

updates:
  # ── Rust / Cargo ────────────────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    # Group all non-breaking bumps into one PR to keep noise low.
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  # ── TypeScript SDK (npm) ────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    groups:
      npm-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - typescript

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
